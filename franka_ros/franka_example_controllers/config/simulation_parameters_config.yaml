circle_controller:
  type: franka_example_controllers/CircleController
  arm_id: fr3
  joint_names:
    - fr3_joint1
    - fr3_joint2
    - fr3_joint3
    - fr3_joint4
    - fr3_joint5
    - fr3_joint6
    - fr3_joint7

  # 轨迹生成配置
  trajectory_type: "circular"        # 轨迹类型(circular/rectangular/figure_eight/line/custom)
  
  # 轨迹中心点 
  center_x: 0.4                      # 轨迹中心X [m]
  center_y: 0.0                      # 轨迹中心Y [m] 
  center_z: 0.405                    # 轨迹中心Z [m]
  speed_factor: 0.1                  # 轨迹速度因子
    
  # 圆形轨迹参数
  circle_radius: 0.08                # 圆轨迹半径 [m]
  circle_frequency: 0.3              # 圆轨迹频率 [Hz]
  circle_plane: "xy"                 # 圆轨迹平面(xy/xz/yz)
    
  # 矩形轨迹参数
  rect_length: 0.2                   # 矩形长度 [m]
  rect_width: 0.1                    # 矩形宽度 [m]
    
  # 八字形轨迹参数
  eight_radius_x: 0.1                # X轴半径 [m]
  eight_radius_y: 0.05               # Y轴半径 [m]
    
  # 直线轨迹参数
  line_length: 0.2                   # 直线长度 [m]
    
  # 自定义轨迹参数
  custom_trajectory_file: ""         # 自定义轨迹文件路径

  # 能量罐安全监控配置 (基于FR3规格的保守设置)
  energy_tank:
    # 能量罐容量 [J]
    capacity_max: 15.0              # 最大能量容量
    capacity_min: 2.0               # 最小能量容量
    
    # 安全阈值 [J]
    threshold_warning: 12.0         # 警告阈值
    threshold_critical: 13.5        # 临界阈值
    threshold_emergency: 14.5       # 紧急阈值
    
    # 速度限制 (FR3最大值的保守安全系数)
    vel_linear_warning: 1.2         # 线速度警告阈值 [m/s] (FR3 max: 3.0)
    vel_linear_critical: 1.5        # 线速度临界阈值 [m/s]
    vel_angular_warning: 1.0        # 角速度警告阈值 [rad/s] (FR3 max: 2.5)
    vel_angular_critical: 1.25      # 角速度临界阈值 [rad/s]
    
    # 功率限制 [W]
    power_warning: 40.0             # 功率警告阈值
    power_critical: 50.0            # 功率临界阈值
    
    # 有效惯性参数
    effective_mass: 2.0             # 末端有效质量 [kg]
    effective_inertia: 0.05         # 末端有效转动惯量 [kg⋅m²]

  # 软接触模型参数 - 基于Hertz-Hunt-Crossley模型
  contact_model:
    young_modulus: 300000.0         # 软块杨氏模量 [Pa] - 300kPa
    poisson_ratio: 0.45             # 软块泊松比 - 近似不可压缩
    probe_young_modulus: 200000000000.0  # 探头杨氏模量 [Pa] - 200GPa (钢材)
    probe_poisson_ratio: 0.3        # 探头泊松比 - 钢材典型值
    friction_coef: 0.0               # 摩擦系数 - 与model.sdf一致
    contact_radius: 0.002             # 接触工具半径 [m] - 圆形探针
    path_radius: 0.1                 # 路径半径 [m] - 圆周运动半径
    damping: 100.0                    # Hunt-Crossley阻尼系数 [Ns/m] - 与model.sdf一致
    force_threshold: 0.5             # 接触力阈值 [N] - 按算法要求设置
    depth_threshold: 0.0001          # 接触深度阈值 [m] - 0.1mm检测精度

  # 控制模式配置
  control_mode: 0  # 控制模式: 0=深度控制, 1=力控制
  
  # 深度控制参数
  depth_controller:
    target_depth: 0.001  # 目标深度 [m] - 增加到3mm，确保足够的深度进行控制
    p_gain: 30.0         # 比例增益 - 增大以提高响应速度
    i_gain: 10.0          # 积分增益 - 增大以消除稳态误差
    d_gain: 5.0          # 微分增益 - 增大以抑制振荡
    max_adjustment: 0.001  # 单次最大调整量 [m] - 增加调整量
    stability_threshold: 0.0005  # 深度稳定阈值 [m] - 放宽到0.5mm
    stability_duration: 2.0      # 深度稳定持续时间 [s] - 减少到2秒

  # 力控制参数 - 仅在control_mode=1时使用
  force_controller:
    target_force: 10.0  # 目标力 [N]
    p_gain: 0.2         # 比例增益
    i_gain: 0.02        # 积分增益
    d_gain: 0.002       # 微分增益
    max_force: 20.0     # 最大力 [N]
    
    # 力轨迹参数
    force_profile_type: "constant"   # 力轨迹类型(constant/sine/step)
    force_sine_amplitude: 2.0        # 正弦力幅值 [N]
    force_sine_frequency: 1.0        # 正弦力频率 [Hz]
    force_step_time: 5.0             # 阶跃力变化时刻 [s]
    force_step_value: 5.0            # 阶跃后力值 [N]
    
    # 力噪声参数
    force_noise_enable: false        # 是否启用力噪声
    force_noise_min: 1.0             # 力噪声最小值 [N]
    force_noise_max: 2.0             # 力噪声最大值 [N]

  # 探头配置
  probe:
    length: 0.114                    # 探头长度 [m] - 从末端法兰到探头尖端的距离

  # 软块配置 (仅用于仿真环境信息，机械臂无法获取软块实际高度)
  soft_block:
    position_x: 0.4                  # 软块X位置 [m] - 仅用于仿真环境设置
    position_y: 0.0                  # 软块Y位置 [m] - 仅用于仿真环境设置  
    position_z: 0.405                # 软块Z位置中心 [m] - 仅用于仿真环境设置
    height: 0.01                     # 软块高度 [m] - 仅用于仿真环境设置

  # 力检测参数
  force_detection:
    change_threshold: 5.0            # 力变化阈值 [N]
    window_size: 5                   # 力历史窗口大小
    use_change_detection: true       # 是否使用力变化检测
    absolute_threshold: 8.0          # 绝对力检测阈值 [N]
    use_absolute_detection: true     # 是否使用绝对力值检测

  # 相位控制参数
  phase_duration: 3.0                # 每个阶段持续时间 [s]
  
  # 调试参数
  debug_mode: true                   # 是否启用调试模式

  # 参考坐标系
  reference_frame: world      # 参考坐标系名称

  # 高级参数
  frequency: 0.5              # 控制频率 [Hz]
  radius: 0.1                 # 半径 [m]
  height: 0.5                 # 高度 [m] 

  # 接触模型参数
  soft_contact_model:
    young_modulus: 300000.0      # 软块杨氏模量 [Pa] - 300kPa
    poisson_ratio: 0.45          # 软块泊松比
    probe_young_modulus: 200000000000.0  # 探头杨氏模量 [Pa] - 200GPa (钢材)
    probe_poisson_ratio: 0.3     # 探头泊松比 - 钢材典型值
    contact_radius: 0.01     # 探头半径 [m]
    depth_threshold: 0.0002  # 接触判定阈值 [m]
    friction_coef: 0.3       # 摩擦系数 - 与model.sdf一致
    damping: 100.0           # 阻尼系数 - 与model.sdf一致 

  # 调零和接触检测参数
  calibration:
    mean_force_threshold: 0.5        # 调零完成阈值 [N] - 按算法要求1s内均值小于0.5N
    variance_threshold: 0.5          # 力方差阈值 [N^2]
    stability_duration: 1.0          # 调零稳定时间要求 [s]
    required_samples: 500            # 调零所需采样数
    
  # 接触检测参数
  contact_detection:
    force_threshold: 0.5             # 接触检测阈值 [N] - 按算法要求z方向力大于0.5N
    confirmation_duration: 0.2       # 接触确认持续时间 [s] - 短暂停留 