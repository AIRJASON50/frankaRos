# ========== DS统一控制器参数配置文件 ==========
# 此文件包含所有DS阻抗控制器的关键参数

# ========== 控制流程参数 ==========
approach_gain: 2.0                # 接近运动增益 [1/s] - 控制机器人向目标吸引子收敛的速度，值越大收敛越快
blend_distance: 0.1               # 运动模式混合距离阈值 [m] - 距离吸引子多远开始从接近运动切换到圆周运动

# ========== 笛卡尔阻抗参数 ==========
# 这些参数控制机器人在笛卡尔空间的刚度和阻尼特性
cartesian_stiffness_ori:          # 姿态刚度矩阵对角线元素 [Nm/rad]
- 30.0                            # 绕X轴旋转刚度 - 控制末端执行器姿态保持能力
- 30.0                            # 绕Y轴旋转刚度 - 值过大会使姿态过于僵硬
- 30.0                            # 绕Z轴旋转刚度 - 值过小会导致姿态不稳定
cartesian_stiffness_pos:          # 位置刚度矩阵对角线元素 [N/m]
- 300.0                           # X方向位置刚度 - 控制位置跟踪精度
- 300.0                           # Y方向位置刚度 - 值过大会使运动过于僵硬
- 300.0                           # Z方向位置刚度 - 值过小会导致位置误差

# ========== 圆周运动DS参数 ==========
circular_radius: 0.025             # 圆周运动半径 [m] - 机器人绕吸引子做圆周运动的半径，建议范围0.01-0.1
constant_tangential_speed: 0.008    # 固定切向速度 [m/s] - 圆周运动的线速度，影响运动流畅性

# ========== 接触检测与力控制参数 ==========
contact_force_threshold: 0.1      # 接触力检测阈值 [N] - 避免误触发
desired_normal_force: 0.5         # 期望法向接触力 [N] - 接触时希望施加的垂直力，建议3.0-10.0
filtered_force_gain: 0.9          # 力传感器滤波增益 [0-1] - 0.9表示强滤波
force_modulation_gain: 1.0        # 力调制增益gamma_p - 建议0.5-2.0

# ========== 力误差PI控制参数 ==========
force_error_kp: 0.04              # 力误差比例增益 [m/s/N] - P项增益，控制对力误差的即时响应
force_error_ki: 0.01              # 力误差积分增益 [m/s/N/s] - I项增益，消除稳态力误差
force_error_max_integral: 0.05    # 积分项饱和限制 [m/s] - 防止积分饱和，建议0.02-0.1

# ========== DS核心控制参数 ==========
# DS控制参数 - Dynamical Systems相关参数
ds_damping_gain: 100.0            # d1: 统一阻抗增益，控制期望速度方向的驱动强度和阻尼 [Nm*s/m]，范围：100-300
ds_damping_gain_orthogonal: 20.0  # d2/d3: 垂直于期望速度方向的阻尼增益 [Nm*s/m]，范围：10-50
approach_gain: 20.0                # 接近增益，控制向吸引子收敛的速度 [-]，范围：1-10
exploration_speed: 0.01           # 探索速度 [m/s] - 用于探测阶段的下降速度
linear_max_velocity: 0.25         # 线性DS最大速度 [m/s] - 从0.05提升到0.15，接近原版DS的0.25

# ========== 能量罐参数 ==========
energy_tank_max: 40.0             # 能量罐最大容量 [J] - 从4.0提升到20.0，接近原版DS的60J，提升柔顺性

# ========== 安全限制参数 ==========
max_joint_torque: 20.0            # 每个关节最大力矩 [Nm] - 关节力矩安全限制
max_orientation_torque: 15.0      # 最大姿态控制力矩 [Nm] - 姿态控制力矩上限
max_velocity: 0.2                 # 全局最大速度限制 [m/s] - 所有运动的速度上限，建议0.1-0.3
min_velocity: 0.01                # 最小速度阈值 [m/s] - 防止运动停滞的最小速度

# ========== 零空间控制参数 ==========
nullspace_stiffness: 20.0         # 零空间刚度 [Nm/rad] - 控制关节回到初始姿态的强度

# ========== 姿态控制参数 ==========
orientation_damping: 15         # 姿态阻尼 [Nm*s/rad] - 姿态控制的阻尼系数
orientation_stiffness: 70.0       # 姿态刚度 [Nm/rad] - 保持末端执行器垂直的刚度

# ========== 运动质量参数 ==========
radial_gain: 8.0                  # 径向收缩增益 [1/s] - 控制向目标半径收敛的速度

# ========== 目标位置配置 ==========
# 由set_attractor_position.py脚本自动设置，无需手动修改
target_position:                  # 目标吸引子位置 [m]
- 0.4145409462444539             # X坐标
- 0.0854433571429344            # Y坐标  
- 0.3006839390198383             # Z坐标（与contact_surface_height应保持一致）